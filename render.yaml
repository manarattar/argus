# Render Blueprint for the public demonstration at argus.manarattar.com
#
# Deploys in DEMO MODE deliberately: no model API key is configured, so the API
# serves the recorded responses in data/recordings and the local lexical
# vectoriser handles retrieval. Everything else - chunking, grounding
# verification, schema validation, citation integrity, scoring, escalation and
# the full 53-case evaluation suite - executes normally.
#
# Why no key on a public deployment:
#   * there is no authentication, so any visitor could trigger inference;
#   * each investigation costs real money and takes ~90s of model time;
#   * rate limiting bounds a single address, not a determined caller.
# A public endpoint with a live key is a spend attack waiting to happen. Demo
# Mode removes the attack surface entirely rather than trying to police it.
#
# To run a deployment against a live model, set MODEL_BACKEND=openai and add
# OPENAI_API_KEY in the Render dashboard - but put authentication in front of it
# first. See docs/architecture/security.md.

services:
  - type: web
    name: argus-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_BACKEND
        value: replay
      - key: EMBEDDING_PROVIDER
        value: local
      # Blank resolves to the bundled SQLite file. The demo is read-mostly and
      # reseeded on boot, so an ephemeral disk is the right trade here.
      - key: DATABASE_URL
        value: ''
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: '8000'
      # The browser only ever calls the web app's own origin, which proxies
      # to this service, so no cross-origin grant is needed. Kept narrow rather
      # than removed, in case the API is ever called directly.
      - key: CORS_ORIGINS
        value: https://argus.manarattar.com
      - key: LOG_LEVEL
        value: INFO
      # Lower than the local default: a public demo needs no more, and it
      # bounds the noise a crawler can generate.
      - key: RATE_LIMIT_PER_MINUTE
        value: '30'

  - type: web
    name: argus-web
    runtime: docker
    dockerfilePath: ./docker/web.Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    autoDeploy: true
    envVars:
      # Read at runtime by next.config.mjs, which proxies /api to the backend.
      # Nothing about the API location is baked into the client bundle, so this
      # can change without a rebuild. Point it at whatever Render named the API
      # service if the default below is not correct.
      - key: API_BASE_URL
        fromService:
          type: web
          name: argus-api
          property: host
